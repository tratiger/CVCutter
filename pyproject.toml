[project]
name = "cvcutter"
version = "0.2.0"
description = "Concert Video Cutter & Uploader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.13",
    "pyright>=1.1.401",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvcutter"]

[project.scripts]
cvcutter = "cvcutter.app:main"

[tool.ruff]
line-length = 100
exclude = ["test-temp", "test-output"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
